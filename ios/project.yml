name: MapleMusic

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "16.4"
  projectFormat: xcode16_0
  bundleIdPrefix: app.maplemusic
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  MapleMusic:
    type: application
    platform: iOS
    sources:
      - path: MapleMusic
        excludes:
          - Resources
      - path: MapleMusic/Resources
        excludes:
          - Info.plist
          - XTool-Info.plist
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: MapleMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Maple Music
        CFBundleName: MapleMusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        YandexClientID: $(YANDEX_CLIENT_ID)
        YandexRedirectURI: maplemusic://oauth
        MusicBackendBaseURL: $(MUSIC_BACKEND_BASE_URL)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.maplemusic.oauth
            CFBundleURLSchemes:
              - maplemusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.maplemusic.client
        PRODUCT_NAME: MapleMusic
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - MapleMusicTests
      gatherCoverageData: true

  MapleMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MapleMusicTests
    dependencies:
      - target: MapleMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.maplemusic.client.tests
        GENERATE_INFOPLIST_FILE: YES
